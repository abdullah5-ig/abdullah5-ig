<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:320px; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",
                Inter,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:-.02em; position:relative;
    /* Flat-ish palette: GIF only has 256 colours, so heavy gradients band. */
    background:#101736;
    -webkit-font-smoothing:antialiased;
  }
  .glow { position:absolute;border-radius:50%;filter:blur(46px); }
  .g1 { width:520px;height:520px;left:-190px;top:-230px;
        background:radial-gradient(circle,#2b3ba8,rgba(16,23,54,0) 70%);opacity:.85; }
  .g2 { width:430px;height:430px;right:-140px;top:-170px;
        background:radial-gradient(circle,#11796d,rgba(16,23,54,0) 72%);opacity:.8; }
  .grid { position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(100% 100% at 50% 40%,#000 0%,transparent 92%); }

  .wrap { position:absolute;left:74px;right:74px;top:44px;z-index:5; }
  .eyebrow { display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;
    letter-spacing:.24em;text-transform:uppercase;color:#8fa4ff; }
  .dot { width:7px;height:7px;border-radius:50%;background:#3ad6c0; }
  h1 { font-size:46px;line-height:1.04;letter-spacing:-.034em;color:#fff;
       font-weight:600;margin-top:11px; }

  /* The typing line. Monospace keeps the caret from jittering. */
  .type { margin-top:14px;height:34px;font-size:21px;font-weight:500;color:#a9e9df;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:-.01em;
    display:flex;align-items:center; }
  .caret { display:inline-block;width:2.5px;height:24px;background:#3ad6c0;
    margin-left:4px;vertical-align:middle; }

  .chips { margin-top:16px;display:flex;gap:9px; }
  .chip { font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;
    background:rgba(255,255,255,.10);color:#e8ecf7;
    border:1px solid rgba(255,255,255,.17); }

  svg.wave { position:absolute;left:0;right:0;bottom:0;width:1200px;height:96px;z-index:2; }
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>

  <div class="wrap">
    <span class="eyebrow"><span class="dot"></span>Data &amp; Fintech Analyst</span>
    <h1>Abdullah Naqvi</h1>
    <div class="type"><span id="txt"></span><span class="caret" id="caret"></span></div>
    <div class="chips">
      <span class="chip">SQL</span><span class="chip">Python</span>
      <span class="chip">Power BI</span><span class="chip">Excel</span>
    </div>
  </div>

  <svg class="wave" viewBox="0 0 1200 96" preserveAspectRatio="none">
    <path id="w1" fill="rgba(58,214,192,0.16)"></path>
    <path id="w2" fill="rgba(143,164,255,0.20)"></path>
  </svg>

<script>
// Every frame is rendered by loading this page with ?f=<frame>&n=<total>.
// Nothing animates in the browser — the frame index drives everything, so
// each PNG is deterministic and the GIF loops perfectly.
const q = new URLSearchParams(location.search);
const f = parseInt(q.get('f') || '0', 10);
const N = parseInt(q.get('n') || '100', 10);

const LINES = [
  "Turning messy data into decisions",
  "Risk & portfolio analytics: CAPM, Sharpe",
  "Churn, pricing and prediction models",
  "BS Business Data Analytics @ COMSATS",
];

// ---- typing timeline -------------------------------------------------
const per = Math.floor(N / LINES.length);      // frames per line
const idx = Math.min(Math.floor(f / per), LINES.length - 1);
const t   = f - idx * per;                     // frame within this line
const line = LINES[idx];

const TYPE = Math.round(per * 0.52);           // typing in
const HOLD = Math.round(per * 0.30);           // pause
let shown;
if (t < TYPE)                 shown = Math.round(line.length * (t / TYPE));
else if (t < TYPE + HOLD)     shown = line.length;
else {
  const d = (t - TYPE - HOLD) / Math.max(1, per - TYPE - HOLD);
  shown = Math.round(line.length * (1 - d));
}
document.getElementById('txt').textContent = line.slice(0, Math.max(0, shown));

// caret blinks roughly twice a second at 12fps
document.getElementById('caret').style.opacity =
  (Math.floor(f / 3) % 2 === 0) ? '1' : '0.15';

// ---- wave --------------------------------------------------------------
function wavePath(phase, amp, yBase) {
  const pts = [];
  for (let x = 0; x <= 1200; x += 12) {
    const y = yBase
            + Math.sin((x / 1200) * Math.PI * 2 + phase) * amp
            + Math.sin((x / 1200) * Math.PI * 4 + phase * 1.7) * (amp * 0.4);
    pts.push(`${x},${y.toFixed(2)}`);
  }
  return `M0,96 L0,${yBase} L` + pts.join(' L') + ` L1200,96 Z`;
}
const phase = (f / N) * Math.PI * 2;
document.getElementById('w1').setAttribute('d', wavePath(phase,          13, 46));
document.getElementById('w2').setAttribute('d', wavePath(phase + 2.1,    10, 62));
</script>
</body></html>
